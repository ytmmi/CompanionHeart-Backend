# ── LLM 配置文件（示例） ──
# 复制此文件为 config.yaml 并填入实际 API Key
# cp config.example.yaml config.yaml

# ── 当前激活的引擎格式（仅支持这三种） ──
# 可选: openai / ollama / anthropic
mode: "openai"

# ── OpenAI 兼容格式（/v1/chat/completions） ──
# 支持: OpenAI / DeepSeek / 任何兼容 API
openai:
  base_url: "https://api.deepseek.com"
  api_key: "sk-your-api-key-here" # ← 替换为实际密钥
  model: "deepseek-v4-flash"
  timeout: 60
  default_params:
    temperature: 0.7
    max_tokens: 2048
    top_p: 0.95
  system_prompt: "你是一个有用的AI助手。"

# ── Ollama 本地推理 ──
ollama:
  base_url: "http://localhost:11434"
  model: "llama3"
  timeout: 120
  default_params:
    temperature: 0.7
    max_tokens: 2048
    top_p: 0.95
  system_prompt: "你是一个有用的AI助手。"

# ── Anthropic 格式（Messages API /v1/messages） ──
# 支持: Anthropic 官方 API / 任何兼容 Messages API 的代理中转
# 注意: Anthropic Messages API 不支持 role: "system" 在 messages 中，
#       引擎会自动提取 system 消息通过请求体 system 字段发送。
anthropic:
  base_url: "https://api.anthropic.com"
  api_key: "sk-ant-..." # ← 替换为实际 Anthropic API Key
  model: "claude-sonnet-4-6" # 可选: claude-opus-4-6 / claude-haiku-4-5 等
  timeout: 120
  default_params:
    temperature: 0.7
    max_tokens: 2048  # max_tokens 为必填
    top_p: 0.95
  system_prompt: "你是一个有用的AI助手。"
