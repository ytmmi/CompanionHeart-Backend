# ── TTS 配置文件（示例） ──
# 复制此文件为 config.yaml 并填入实际路径
# cp config.example.yaml config.yaml

# 当前使用的模式: local / api / edge
mode: "local"

# ── 本地模式（直接使用 genie_tts 库） ──
local:
  data_dir: "app/models/tts/Genie/GenieData"
  model_base_dir: "app/models/tts/Genie/models/v2ProPlus"
  output_dir: "data/audio"

  characters:
    mika:
      name: "mika"
      language: "jp"
      description: "聖園ミカ / 蔚蓝档案"
      prompt_wav: "917575.wav"
      prompt_text: "私も昔、これと似たようなの持ってたなぁ…。"
    feibi:
      name: "feibi"
      language: "zh"
      description: "菲比 / 鸣潮"
      prompt_wav: "zh_vo_Main_Linaxita_2_1_10_26.wav"
      prompt_text: "在此之前，请您务必继续享受旅居拉古那的时光。"
    thirtyseven:
      name: "thirtyseven"
      language: "en"
      description: "37 / 重返未来1999"
      prompt_wav: "En_play_hero3066_fightingvoc_19.wav"
      prompt_text: "And now, I belong to this set."

  default_params:
    split_sentence: false
    play: false

# ── API 模式（连接远程 TTS 服务） ──
api:
  base_url: "http://127.0.0.1:8000"
  timeout: 120
  endpoints:
    load_character: "/load_character"
    set_reference_audio: "/set_reference_audio"
    tts: "/tts"
    unload_character: "/unload_character"
    stop: "/stop"
    clear_cache: "/clear_reference_audio_cache"

# ── Edge-TTS 模式（微软在线 TTS，免费，无需 API Key） ──
edge:
  output_dir: "data/audio"
  voices:
    jp:
      voice: "ja-JP-NanamiNeural"
      language: "jp"
      description: "日语女声 (Nanami)"
    zh:
      voice: "zh-CN-XiaoxiaoNeural"
      language: "zh"
      description: "中文女声 (晓晓)"
    en:
      voice: "en-US-AriaNeural"
      language: "en"
      description: "英文女声 (Aria)"
  default_params:
    rate: "+0%"
    volume: "+0%"
    pitch: "+0Hz"
